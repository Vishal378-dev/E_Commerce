version: "3"

services:
  pgDb:
    image: postgres:14.1-alpine
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vendor
    networks:
      - my-network  
volumes:
  db:
    driver: local

networks:
  my-network:    